[package]
name = "powerusd"
version = "0.8.0"
edition = "2021"
description = "Fast USD asset browser and viewer"
license = "MIT"
repository = "https://github.com/cl0nazepamm/powerusd/"
keywords = ["usd", "openusd", "3d", "asset-browser", "viewer"]
categories = ["graphics", "rendering", "visualization"]

[dependencies]
openusd = { path = "deps/openusd" }
three-d = { path = "deps/three-d", features = ["egui-gui"] }
three-d-asset = { version = "0.9", features = ["gltf", "png", "jpeg"] }
anyhow = "1.0"
winit = "0.28"
egui = "0.32"
image = "0.25"
rayon = "1.7"
arboard = "3"
quick-xml = "0.37"
rfd = "0.15"
raw-window-handle = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
